<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>

  <!-- header -->
  <text x="80" y="72" font-size="20" font-weight="600" fill="#0F172A">DateRangePicker 日期范围选择器</text>
  <text x="80" y="100" font-size="14" fill="#64748B">快捷项（今日/近7天/近30天/自定义）+ 双日历面板，含「按消息时间 / 创建时间」切换。输入框 36px。</text>
  <line x1="80" y1="120" x2="1840" y2="120" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 收起态 ===== -->
  <text x="80" y="172" font-size="16" font-weight="600" fill="#0F172A">收起态 · 输入框 36px</text>
  <!-- time-type toggle -->
  <rect x="80" y="192" width="200" height="36" rx="6" fill="#F1F5F9"/>
  <rect x="84" y="196" width="96" height="28" rx="5" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="100" y="215" font-size="13" fill="#2563EB">消息时间</text>
  <text x="196" y="215" font-size="13" fill="#64748B">创建时间</text>
  <!-- input -->
  <rect x="296" y="192" width="320" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- calendar icon -->
  <rect x="312" y="202" width="16" height="16" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <line x1="312" y1="207" x2="328" y2="207" stroke="#64748B" stroke-width="1.4"/>
  <text x="340" y="215" font-size="13" fill="#0F172A">2026-06-05  ～  2026-06-12</text>
  <!-- chevron -->
  <path d="M596 206 l5 5 l5 -5" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <!-- height annotation -->
  <line x1="636" y1="192" x2="636" y2="228" stroke="#DC2626" stroke-width="1"/>
  <line x1="631" y1="192" x2="641" y2="192" stroke="#DC2626" stroke-width="1"/>
  <line x1="631" y1="228" x2="641" y2="228" stroke="#DC2626" stroke-width="1"/>
  <text x="648" y="214" font-size="12" fill="#DC2626">高 36px</text>

  <!-- ===== 展开态 双日历面板 ===== -->
  <text x="80" y="296" font-size="16" font-weight="600" fill="#0F172A">展开态 · 快捷项 + 双日历面板</text>

  <!-- panel -->
  <rect x="80" y="316" width="720" height="420" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- left shortcuts -->
  <rect x="80" y="316" width="140" height="420" rx="12" fill="#F8FAFC"/>
  <rect x="208" y="316" width="12" height="420" fill="#F8FAFC"/>
  <line x1="220" y1="316" x2="220" y2="736" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="92" y="340" width="116" height="32" rx="6" fill="#EFF4FF"/>
  <text x="104" y="361" font-size="13" fill="#2563EB">今日</text>
  <text x="104" y="397" font-size="13" fill="#475569">近 7 天</text>
  <text x="104" y="433" font-size="13" fill="#475569">近 30 天</text>
  <text x="104" y="469" font-size="13" fill="#475569">本月</text>
  <text x="104" y="505" font-size="13" fill="#475569">上月</text>
  <text x="104" y="541" font-size="13" fill="#475569">自定义</text>

  <!-- calendar month 1 -->
  <text x="248" y="356" font-size="14" font-weight="600" fill="#0F172A">2026 年 6 月</text>
  <path d="M242 350 l-5 -5 l5 -5" fill="none" stroke="#64748B" stroke-width="1.4" transform="translate(-2,6)"/>
  <!-- weekdays -->
  <g font-size="11" fill="#94A3B8">
    <text x="244" y="384">一</text><text x="284" y="384">二</text><text x="324" y="384">三</text><text x="364" y="384">四</text><text x="404" y="384">五</text><text x="444" y="384">六</text><text x="484" y="384">日</text>
  </g>
  <!-- days grid (range highlight from 5) -->
  <g font-size="12" fill="#0F172A">
    <text x="244" y="412">1</text><text x="284" y="412">2</text><text x="324" y="412">3</text><text x="364" y="412">4</text>
    <!-- start day 5 -->
    <rect x="396" y="400" width="24" height="22" rx="5" fill="#2563EB"/><text x="403" y="416" fill="#FFFFFF">5</text>
    <rect x="436" y="400" width="24" height="22" fill="#EFF4FF"/><text x="443" y="416">6</text>
    <rect x="476" y="400" width="24" height="22" fill="#EFF4FF"/><text x="483" y="416">7</text>
    <rect x="236" y="428" width="24" height="22" fill="#EFF4FF"/><text x="244" y="444">8</text>
    <rect x="276" y="428" width="24" height="22" fill="#EFF4FF"/><text x="282" y="444">9</text>
    <rect x="316" y="428" width="24" height="22" fill="#EFF4FF"/><text x="320" y="444">10</text>
    <rect x="356" y="428" width="24" height="22" fill="#EFF4FF"/><text x="360" y="444">11</text>
    <text x="244" y="476">15</text><text x="284" y="476">16</text><text x="324" y="476">17</text><text x="364" y="476">18</text><text x="404" y="476">19</text><text x="444" y="476">20</text><text x="484" y="476">21</text>
    <text x="244" y="508">22</text><text x="284" y="508">23</text><text x="324" y="508">24</text><text x="364" y="508">25</text><text x="404" y="508">26</text><text x="444" y="508">27</text><text x="484" y="508">28</text>
  </g>

  <!-- calendar month 2 -->
  <line x1="540" y1="332" x2="540" y2="720" stroke="#F1F5F9" stroke-width="1"/>
  <text x="566" y="356" font-size="14" font-weight="600" fill="#0F172A">2026 年 7 月</text>
  <path d="M772 350 l5 -5 l-5 -5" fill="none" stroke="#64748B" stroke-width="1.4" transform="translate(0,6)"/>
  <g font-size="11" fill="#94A3B8">
    <text x="562" y="384">一</text><text x="592" y="384">二</text><text x="622" y="384">三</text><text x="652" y="384">四</text><text x="682" y="384">五</text><text x="712" y="384">六</text><text x="742" y="384">日</text>
  </g>
  <g font-size="12" fill="#0F172A">
    <text x="652" y="412">1</text><text x="682" y="412">2</text><text x="712" y="412">3</text><text x="742" y="412">4</text>
    <text x="562" y="444">5</text><text x="592" y="444">6</text><text x="622" y="444">7</text><text x="652" y="444">8</text><text x="682" y="444">9</text><text x="710" y="444">10</text><text x="740" y="444">11</text>
    <text x="560" y="476">12</text><text x="590" y="476">13</text><text x="620" y="476">14</text><text x="650" y="476">15</text><text x="680" y="476">16</text><text x="710" y="476">17</text><text x="740" y="476">18</text>
  </g>

  <!-- panel footer -->
  <line x1="220" y1="680" x2="800" y2="680" stroke="#E2E8F0" stroke-width="1"/>
  <text x="248" y="712" font-size="13" fill="#64748B">已选：2026-06-05 ～ 2026-06-12（按消息时间）</text>
  <rect x="620" y="694" width="72" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="640" y="715" font-size="13" fill="#475569">取消</text>
  <rect x="704" y="694" width="72" height="32" rx="6" fill="#2563EB"/>
  <text x="724" y="715" font-size="13" fill="#FFFFFF">确定</text>

  <!-- annotation -->
  <line x1="60" y1="316" x2="60" y2="736" stroke="#0891B2" stroke-width="1"/>
  <text x="36" y="540" font-size="11" fill="#0891B2" transform="rotate(-90 36 540)" text-anchor="middle">快捷项侧栏 140px</text>

  <!-- spec -->
  <text x="860" y="356" font-size="16" font-weight="600" fill="#0F172A">规范要点</text>
  <text x="860" y="392" font-size="13" fill="#64748B">· 收起态输入框高 36px，圆角 6px，左侧日历图标 + 范围文本。</text>
  <text x="860" y="418" font-size="13" fill="#64748B">· 时间维度切换 Segmented：消息时间 / 创建时间，选中项白底 Primary 文字。</text>
  <text x="860" y="444" font-size="13" fill="#64748B">· 展开面板左侧快捷项侧栏 140px，右侧双月日历联动选择。</text>
  <text x="860" y="470" font-size="13" fill="#64748B">· 范围区间浅底 #EFF4FF，起止端点实底 Primary #2563EB 白字。</text>
  <text x="860" y="496" font-size="13" fill="#64748B">· 底部固定操作区：左侧已选摘要，右侧取消 / 确定按钮（高 32px）。</text>
</svg>

  <rect x="1116" y="616" width="160" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1196" y="643" font-size="14" fill="#0F172A" text-anchor="middle">从记录列表导入</text>

  <!-- 格式提示 -->
  <text x="1080" y="752" font-size="12" fill="#94A3B8" text-anchor="middle" font-family="monospace">支持格式：record.json（单文件 ≤ 50MB） · 仅在本地解析，不上传服务器</text>


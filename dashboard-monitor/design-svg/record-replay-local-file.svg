    <text x="0" y="36" font-size="11" fill="#94A3B8" text-anchor="middle" font-family="monospace">JSON</text>
    <!-- 上传箭头 -->
    <circle cx="34" cy="40" r="22" fill="#2563EB"/>
    <path d="M34 30 l0 20 M26 38 l8 -8 l8 8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 说明文字 -->
  <text x="1080" y="556" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">从本地选择 record.json 文件进行回放</text>
  <text x="1080" y="586" font-size="14" fill="#64748B" text-anchor="middle">将文件拖拽到此处，或点击下方按钮选择。支持采集器导出的会话记录 JSON。</text>

  <!-- 选择文件按钮 -->
  <rect x="940" y="616" width="160" height="44" rx="10" fill="#2563EB"/>
  <path d="M962 638 l0 -12 M956 632 l6 -6 l6 6 M956 644 l12 0" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

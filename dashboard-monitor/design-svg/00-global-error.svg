<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- ===== 背景 ===== -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>

  <!-- ===== 左侧导航 240px ===== -->
  <rect x="0" y="0" width="240" height="1080" fill="#FFFFFF"/>
  <line x1="240" y1="0" x2="240" y2="1080" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Logo + 名称 -->
  <rect x="20" y="16" width="32" height="32" rx="8" fill="#2563EB"/>
  <path d="M28 32 l4 4 l8 -8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="30" font-size="15" font-weight="600" fill="#0F172A">工作量后台</text>
  <text x="62" y="45" font-size="11" fill="#64748B">dashboard-monitor</text>
  <line x1="16" y1="68" x2="224" y2="68" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 分组：概览组 -->
  <text x="20" y="92" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">概览</text>
  <rect x="8" y="100" width="224" height="40" rx="8" fill="#EFF4FF"/>
  <rect x="8" y="100" width="3" height="40" rx="1.5" fill="#2563EB"/>
  <rect x="22" y="112" width="16" height="16" rx="3" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  <line x1="26" y1="120" x2="34" y2="120" stroke="#2563EB" stroke-width="1.6"/>
  <text x="50" y="125" font-size="14" font-weight="600" fill="#2563EB">总览</text>
  <circle cx="30" cy="160" r="6" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <circle cx="30" cy="160" r="2" fill="#64748B"/>
  <text x="50" y="165" font-size="14" fill="#0F172A">实时监控台</text>
  <path d="M24 204 l0 -10 M30 204 l0 -16 M36 204 l0 -7" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  <text x="50" y="205" font-size="14" fill="#0F172A">数据分析</text>

  <!-- 分组：消息记录组 -->
  <line x1="16" y1="226" x2="224" y2="226" stroke="#F1F5F9" stroke-width="1"/>
  <text x="20" y="250" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">消息记录</text>
  <rect x="23" y="270" width="14" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <line x1="26" y1="275" x2="34" y2="275" stroke="#64748B" stroke-width="1.4"/>
  <line x1="26" y1="279" x2="34" y2="279" stroke="#64748B" stroke-width="1.4"/>
  <text x="50" y="283" font-size="14" fill="#0F172A">记录列表</text>
  <path d="M25 318 l0 16 M25 318 q9 8 0 16" stroke="#64748B" stroke-width="1.6" fill="none"/>
  <path d="M30 322 l6 4 l-6 4 z" fill="#64748B"/>
  <text x="50" y="331" font-size="14" fill="#0F172A">会话回放</text>

  <!-- 分组：研发流程组 -->
  <line x1="16" y1="352" x2="224" y2="352" stroke="#F1F5F9" stroke-width="1"/>
  <text x="20" y="376" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">研发流程</text>
  <rect x="24" y="390" width="13" height="16" rx="2" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <text x="50" y="409" font-size="14" fill="#0F172A">需求</text>
  <path d="M24 440 l4 4 l8 -8" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="447" font-size="14" fill="#0F172A">开发任务</text>
  <circle cx="26" cy="481" r="3" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <circle cx="26" cy="495" r="3" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <line x1="26" y1="484" x2="26" y2="492" stroke="#64748B" stroke-width="1.6"/>
  <text x="50" y="491" font-size="14" fill="#0F172A">仓库</text>

  <!-- 分组：运行诊断组 -->
  <line x1="16" y1="514" x2="224" y2="514" stroke="#F1F5F9" stroke-width="1"/>
  <text x="20" y="538" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">运行诊断</text>
  <path d="M23 558 l-4 4 l4 4 M37 558 l4 4 l-4 4" stroke="#64748B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="567" font-size="14" fill="#0F172A">接口调用</text>
  <path d="M22 604 q4 -8 8 0 q4 8 8 0" stroke="#64748B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="50" y="609" font-size="14" fill="#0F172A">长连接事件</text>
  <circle cx="30" cy="646" r="8" fill="none" stroke="#DC2626" stroke-width="1.6"/>
  <line x1="30" y1="642" x2="30" y2="647" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="30" cy="650" r="1" fill="#DC2626"/>
  <text x="50" y="651" font-size="14" fill="#0F172A">错误中心</text>

  <!-- 分组：报表与设置组 -->
  <line x1="16" y1="672" x2="224" y2="672" stroke="#F1F5F9" stroke-width="1"/>
  <text x="20" y="696" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">报表与设置</text>
  <path d="M24 714 a4 4 0 0 1 6 0 l1 1 a4 4 0 0 1 -6 6 M36 728 a4 4 0 0 1 -6 0 l-1 -1 a4 4 0 0 1 6 -6" stroke="#64748B" stroke-width="1.6" fill="none"/>
  <text x="50" y="725" font-size="14" fill="#0F172A">周报链接</text>
  <path d="M30 760 l0 12 M26 768 l4 4 l4 -4 M23 776 l14 0" stroke="#64748B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="50" y="773" font-size="14" fill="#0F172A">报表导出</text>
  <circle cx="30" cy="814" r="4" fill="none" stroke="#64748B" stroke-width="1.6"/>
  <circle cx="30" cy="814" r="8" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="2 3"/>
  <text x="50" y="819" font-size="14" fill="#0F172A">设置</text>

  <!-- 底部数据源连接状态（断开） -->
  <line x1="16" y1="996" x2="224" y2="996" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="16" y="1012" width="208" height="48" rx="8" fill="#FEF2F2"/>
  <circle cx="34" cy="1036" r="5" fill="#DC2626"/>
  <text x="50" y="1032" font-size="12" font-weight="600" fill="#DC2626">数据源已断开</text>
  <text x="50" y="1048" font-size="11" fill="#64748B">WebSocket · 连接失败</text>

  <!-- ===== 顶栏 56px ===== -->
  <rect x="240" y="0" width="1680" height="56" fill="#FFFFFF"/>
  <line x1="240" y1="56" x2="1920" y2="56" stroke="#E2E8F0" stroke-width="1"/>
  <text x="264" y="34" font-size="20" font-weight="600" fill="#0F172A">总览</text>
  <text x="318" y="34" font-size="13" fill="#94A3B8">概览 / 总览</text>
  <rect x="800" y="14" width="280" height="28" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="810" y="22" width="12" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <line x1="813" y1="20" x2="813" y2="24" stroke="#64748B" stroke-width="1.4"/>
  <line x1="819" y1="20" x2="819" y2="24" stroke="#64748B" stroke-width="1.4"/>
  <text x="832" y="33" font-size="13" fill="#0F172A">2026-06-05 ~ 2026-06-12</text>
  <path d="M1058 25 l5 5 l5 -5" stroke="#64748B" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1660" y="14" width="84" height="28" rx="6" fill="#2563EB"/>
  <path d="M1676 24 a6 6 0 1 0 2 -4 M1676 20 l0 4 l4 0" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1690" y="33" font-size="13" fill="#FFFFFF">刷新</text>
  <text x="1762" y="33" font-size="13" fill="#64748B">自动刷新</text>
  <rect x="1830" y="20" width="34" height="16" rx="8" fill="#CBD5E1"/>
  <circle cx="1838" cy="28" r="6" fill="#FFFFFF"/>
  <!-- 健康灯：错误 -->
  <circle cx="1896" cy="28" r="7" fill="#DC2626"/>
  <line x1="1896" y1="24" x2="1896" y2="29" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="1896" cy="32" r="1" fill="#FFFFFF"/>

  <!-- ===== 顶部贯穿红色全局告警条 ===== -->
  <rect x="240" y="56" width="1680" height="52" fill="#DC2626"/>
  <!-- 告警图标 -->
  <path d="M286 70 l16 28 l-32 0 z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <line x1="286" y1="80" x2="286" y2="89" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="286" cy="93" r="1.4" fill="#FFFFFF"/>
  <text x="320" y="87" font-size="15" font-weight="600" fill="#FFFFFF">数据源连接已断开</text>
  <text x="470" y="87" font-size="13" fill="#FECACA">实时数据停止更新，当前展示为最近一次缓存快照（2026-06-12 14:32:07）</text>
  <!-- 重试按钮 -->
  <rect x="1772" y="69" width="124" height="28" rx="6" fill="#FFFFFF"/>
  <path d="M1792 83 a6 6 0 1 0 2 -4 M1792 79 l0 4 l4 0" stroke="#DC2626" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1808" y="88" font-size="13" font-weight="600" fill="#DC2626">立即重试连接</text>

  <!-- ===== 内容区中央错误状态 ===== -->
  <!-- 居中点：内容区中心 x = 240 + 1680/2 = 1080；可视高度从 108 到 1080 -->
  <g>
    <!-- 错误插画：断开的连接 -->
    <circle cx="1080" cy="420" r="120" fill="#FEF2F2"/>
    <!-- 左插头 -->
    <rect x="940" y="404" width="70" height="32" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
    <line x1="1010" y1="414" x2="1030" y2="414" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="1010" y1="426" x2="1030" y2="426" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <!-- 右插头 -->
    <rect x="1150" y="404" width="70" height="32" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
    <line x1="1130" y1="414" x2="1150" y2="414" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="1130" y1="426" x2="1150" y2="426" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <!-- 断裂火花 -->
    <path d="M1070 390 l-8 24 l12 -4 l-6 22" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="1080" y1="360" x2="1080" y2="375" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="1110" y1="372" x2="1120" y2="362" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="1050" y1="372" x2="1040" y2="362" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="1080" y="610" font-size="24" font-weight="600" fill="#0F172A" text-anchor="middle">无法连接到数据源</text>
  <text x="1080" y="646" font-size="14" fill="#64748B" text-anchor="middle">与监控数据服务的实时连接已中断，请检查本地服务进程或网络后重试。</text>
  <text x="1080" y="670" font-size="13" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">错误码 ECONNREFUSED · ws://127.0.0.1:8080/stream</text>

  <!-- 重试主按钮 + 次按钮 -->
  <rect x="1000" y="700" width="120" height="44" rx="8" fill="#2563EB"/>
  <path d="M1024 722 a8 8 0 1 0 3 -6 M1024 716 l0 6 l6 0" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1044" y="727" font-size="15" font-weight="600" fill="#FFFFFF">重试</text>

  <rect x="1132" y="700" width="148" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1206" y="727" font-size="15" fill="#0F172A" text-anchor="middle">查看错误中心</text>
</svg>

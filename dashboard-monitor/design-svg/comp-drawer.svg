<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>

  <!-- header -->
  <text x="80" y="72" font-size="20" font-weight="600" fill="#0F172A">Drawer 详情抽屉</text>
  <text x="80" y="100" font-size="14" fill="#64748B">右侧滑出 560px：标题栏 + 分区内容 + 底部操作，遮罩半透明覆盖背景。</text>
  <line x1="80" y1="120" x2="1840" y2="120" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 模拟页面区域 ===== -->
  <rect x="80" y="160" width="1760" height="800" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- faux page content under mask -->
  <rect x="120" y="200" width="240" height="16" rx="4" fill="#E2E8F0"/>
  <rect x="120" y="240" width="600" height="120" rx="8" fill="#F1F5F9"/>
  <rect x="120" y="384" width="600" height="120" rx="8" fill="#F1F5F9"/>

  <!-- mask -->
  <rect x="80" y="160" width="1760" height="800" rx="12" fill="#0F172A" opacity="0.4"/>

  <!-- drawer 560 -->
  <rect x="1280" y="160" width="560" height="800" fill="#FFFFFF"/>
  <!-- title bar -->
  <line x1="1280" y1="224" x2="1840" y2="224" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1312" y="200" font-size="16" font-weight="600" fill="#0F172A">消息记录详情</text>
  <text x="1312" y="216" font-size="12" fill="#94A3B8">om_7d2f1a9c4b</text>
  <!-- close X -->
  <line x1="1796" y1="184" x2="1812" y2="200" stroke="#64748B" stroke-width="1.6"/>
  <line x1="1812" y1="184" x2="1796" y2="200" stroke="#64748B" stroke-width="1.6"/>

  <!-- section 1: 基本信息 -->
  <text x="1312" y="266" font-size="14" font-weight="600" fill="#0F172A">基本信息</text>
  <text x="1312" y="298" font-size="13" fill="#64748B">消息类型</text>
  <text x="1700" y="298" font-size="13" fill="#0F172A" text-anchor="end">群消息 · 文本</text>
  <line x1="1312" y1="314" x2="1808" y2="314" stroke="#F1F5F9" stroke-width="1"/>
  <text x="1312" y="342" font-size="13" fill="#64748B">发送者</text>
  <text x="1700" y="342" font-size="13" fill="#0F172A" text-anchor="end">张三 (ou_3f8a2b)</text>
  <line x1="1312" y1="358" x2="1808" y2="358" stroke="#F1F5F9" stroke-width="1"/>
  <text x="1312" y="386" font-size="13" fill="#64748B">接收时间</text>
  <text x="1700" y="386" font-size="13" fill="#0F172A" text-anchor="end">2026-06-12 09:21:02</text>
  <line x1="1312" y1="402" x2="1808" y2="402" stroke="#F1F5F9" stroke-width="1"/>
  <text x="1312" y="430" font-size="13" fill="#64748B">处理状态</text>
  <rect x="1640" y="416" width="64" height="22" rx="6" fill="#DCFCE7"/>
  <circle cx="1654" cy="427" r="4" fill="#16A34A"/>
  <text x="1664" y="431" font-size="12" fill="#16A34A">成功</text>

  <!-- section 2: 内容预览 -->
  <text x="1312" y="490" font-size="14" font-weight="600" fill="#0F172A">内容预览</text>
  <rect x="1312" y="506" width="496" height="120" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1328" y="534" font-size="13" fill="#475569" font-family="monospace">本次发布包含 12 项需求与 3 个</text>
  <text x="1328" y="556" font-size="13" fill="#475569" font-family="monospace">缺陷修复，请相关同学留意。</text>

  <!-- section 3: 关联任务 -->
  <text x="1312" y="678" font-size="14" font-weight="600" fill="#0F172A">关联开发任务</text>
  <rect x="1312" y="694" width="496" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="1328" y="710" width="24" height="24" rx="6" fill="#EFF4FF"/>
  <text x="1334" y="727" font-size="12" fill="#2563EB">DT</text>
  <text x="1364" y="720" font-size="13" font-weight="600" fill="#0F172A">#10248 消息采集任务</text>
  <text x="1364" y="738" font-size="12" fill="#64748B">耗时 128ms · 成功</text>
  <text x="1788" y="728" font-size="13" fill="#2563EB" text-anchor="end">›</text>

  <!-- footer action bar -->
  <line x1="1280" y1="888" x2="1840" y2="888" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="1568" y="908" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1592" y="931" font-size="14" fill="#475569">关闭</text>
  <rect x="1684" y="908" width="124" height="36" rx="6" fill="#2563EB"/>
  <text x="1708" y="931" font-size="14" fill="#FFFFFF">查看原始 JSON</text>

  <!-- width annotation -->
  <line x1="1280" y1="140" x2="1840" y2="140" stroke="#DC2626" stroke-width="1"/>
  <line x1="1280" y1="135" x2="1280" y2="145" stroke="#DC2626" stroke-width="1"/>
  <line x1="1840" y1="135" x2="1840" y2="145" stroke="#DC2626" stroke-width="1"/>
  <text x="1560" y="134" font-size="12" fill="#DC2626" text-anchor="middle">宽度 560px</text>

  <!-- 遮罩说明 -->
  <text x="600" y="640" font-size="13" fill="#FFFFFF">遮罩 #0F172A · 40% 不透明度</text>
  <text x="600" y="666" font-size="13" fill="#E2E8F0">点击遮罩关闭抽屉，抽屉自右向左滑入。</text>

  <!-- spec footer -->
  <text x="120" y="730" font-size="16" font-weight="600" fill="#FFFFFF">结构规范</text>
  <text x="120" y="764" font-size="13" fill="#E2E8F0">· 抽屉固定宽 560px，贴右侧边缘，内边距 32px。</text>
  <text x="120" y="790" font-size="13" fill="#E2E8F0">· 顶部标题栏含标题 + 副标题 + 关闭按钮；底部操作栏吸底。</text>
  <text x="120" y="816" font-size="13" fill="#E2E8F0">· 中部内容区可滚动，按「分区标题 + 键值/卡片」组织。</text>
  <text x="120" y="842" font-size="13" fill="#E2E8F0">· 主操作按钮高 36px，置于底部右侧。</text>
</svg>

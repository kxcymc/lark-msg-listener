<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>

  <!-- header -->
  <text x="80" y="72" font-size="20" font-weight="600" fill="#0F172A">ChartCard 图表卡</text>
  <text x="80" y="100" font-size="14" fill="#64748B">标题栏（左标题 + 右操作：维度切换 / 时间 / 全屏）48px + 图表区。支持饼图、柱状图、折线图三种内容变体。</text>
  <line x1="80" y1="120" x2="1840" y2="120" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== variant 1: 饼图 ===== -->
  <rect x="80" y="170" width="560" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- title bar 48 -->
  <line x1="80" y1="218" x2="640" y2="218" stroke="#E2E8F0" stroke-width="1"/>
  <text x="104" y="200" font-size="16" font-weight="600" fill="#0F172A">消息类型分布</text>
  <!-- ops icons -->
  <rect x="500" y="182" width="60" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="512" y="198" font-size="12" fill="#64748B">维度</text>
  <rect x="568" y="182" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="580" cy="194" r="6" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <line x1="580" y1="194" x2="580" y2="190" stroke="#64748B" stroke-width="1.4"/>
  <line x1="580" y1="194" x2="583" y2="196" stroke="#64748B" stroke-width="1.4"/>
  <rect x="600" y="182" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M606 188 h5 M606 188 v5 M618 200 h-5 M618 200 v-5" stroke="#64748B" stroke-width="1.4" fill="none"/>
  <!-- pie chart -->
  <g transform="translate(220,400)">
    <path d="M0 0 L0 -90 A90 90 0 0 1 78 45 Z" fill="#2563EB"/>
    <path d="M0 0 L78 45 A90 90 0 0 1 -45 78 Z" fill="#0891B2"/>
    <path d="M0 0 L-45 78 A90 90 0 0 1 -85 -28 Z" fill="#16A34A"/>
    <path d="M0 0 L-85 -28 A90 90 0 0 1 0 -90 Z" fill="#D97706"/>
    <circle cx="0" cy="0" r="48" fill="#FFFFFF"/>
  </g>
  <!-- legend -->
  <rect x="420" y="320" width="10" height="10" rx="2" fill="#2563EB"/>
  <text x="438" y="329" font-size="13" fill="#475569">文本消息 42%</text>
  <rect x="420" y="350" width="10" height="10" rx="2" fill="#0891B2"/>
  <text x="438" y="359" font-size="13" fill="#475569">卡片消息 28%</text>
  <rect x="420" y="380" width="10" height="10" rx="2" fill="#16A34A"/>
  <text x="438" y="389" font-size="13" fill="#475569">图片消息 18%</text>
  <rect x="420" y="410" width="10" height="10" rx="2" fill="#D97706"/>
  <text x="438" y="419" font-size="13" fill="#475569">其它 12%</text>
  <text x="104" y="540" font-size="12" fill="#94A3B8">变体一 · 饼图</text>

  <!-- ===== variant 2: 柱状图 ===== -->
  <rect x="680" y="170" width="560" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="680" y1="218" x2="1240" y2="218" stroke="#E2E8F0" stroke-width="1"/>
  <text x="704" y="200" font-size="16" font-weight="600" fill="#0F172A">每日处理量</text>
  <rect x="1100" y="182" width="60" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1112" y="198" font-size="12" fill="#64748B">近7天</text>
  <rect x="1168" y="182" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M1174 188 h5 M1174 188 v5 M1186 200 h-5 M1186 200 v-5" stroke="#64748B" stroke-width="1.4" fill="none"/>
  <rect x="1200" y="182" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="1208" cy="194" r="5" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <line x1="1212" y1="198" x2="1216" y2="202" stroke="#64748B" stroke-width="1.4"/>
  <!-- axis -->
  <line x1="730" y1="500" x2="1200" y2="500" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="730" y1="260" x2="730" y2="500" stroke="#E2E8F0" stroke-width="1"/>
  <!-- bars -->
  <rect x="760" y="380" width="40" height="120" rx="4" fill="#2563EB"/>
  <rect x="820" y="330" width="40" height="170" rx="4" fill="#2563EB"/>
  <rect x="880" y="410" width="40" height="90" rx="4" fill="#2563EB"/>
  <rect x="940" y="300" width="40" height="200" rx="4" fill="#2563EB"/>
  <rect x="1000" y="350" width="40" height="150" rx="4" fill="#2563EB"/>
  <rect x="1060" y="280" width="40" height="220" rx="4" fill="#2563EB"/>
  <rect x="1120" y="360" width="40" height="140" rx="4" fill="#93C5FD"/>
  <text x="772" y="518" font-size="11" fill="#94A3B8">周一</text>
  <text x="832" y="518" font-size="11" fill="#94A3B8">周二</text>
  <text x="892" y="518" font-size="11" fill="#94A3B8">周三</text>
  <text x="952" y="518" font-size="11" fill="#94A3B8">周四</text>
  <text x="1012" y="518" font-size="11" fill="#94A3B8">周五</text>
  <text x="1072" y="518" font-size="11" fill="#94A3B8">周六</text>
  <text x="1132" y="518" font-size="11" fill="#94A3B8">周日</text>

  <!-- ===== variant 3: 折线图 ===== -->
  <rect x="1280" y="170" width="560" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="1280" y1="218" x2="1840" y2="218" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1304" y="200" font-size="16" font-weight="600" fill="#0F172A">响应延迟趋势</text>
  <rect x="1700" y="182" width="60" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1712" y="198" font-size="12" fill="#64748B">P95</text>
  <rect x="1768" y="182" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <path d="M1774 188 h5 M1774 188 v5 M1786 200 h-5 M1786 200 v-5" stroke="#64748B" stroke-width="1.4" fill="none"/>
  <rect x="1800" y="182" width="24" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="1808" cy="194" r="5" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <line x1="1812" y1="198" x2="1816" y2="202" stroke="#64748B" stroke-width="1.4"/>
  <!-- axis grid -->
  <line x1="1330" y1="500" x2="1800" y2="500" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="1330" y1="260" x2="1330" y2="500" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="1330" y1="320" x2="1800" y2="320" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="1330" y1="410" x2="1800" y2="410" stroke="#F1F5F9" stroke-width="1"/>
  <!-- area + line -->
  <polyline points="1340,440 1410,400 1480,420 1550,350 1620,380 1690,300 1760,330" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <polyline points="1340,470 1410,440 1480,455 1550,400 1620,430 1690,360 1760,390" fill="none" stroke="#0891B2" stroke-width="2.5"/>
  <circle cx="1760" cy="330" r="3.5" fill="#16A34A"/>
  <circle cx="1760" cy="390" r="3.5" fill="#0891B2"/>

  <!-- ===== title bar height annotation ===== -->
  <line x1="60" y1="170" x2="60" y2="218" stroke="#DC2626" stroke-width="1"/>
  <line x1="55" y1="170" x2="65" y2="170" stroke="#DC2626" stroke-width="1"/>
  <line x1="55" y1="218" x2="65" y2="218" stroke="#DC2626" stroke-width="1"/>
  <text x="36" y="198" font-size="11" fill="#DC2626" transform="rotate(-90 36 198)" text-anchor="middle">标题栏 48px</text>

  <!-- spec footer -->
  <text x="80" y="640" font-size="16" font-weight="600" fill="#0F172A">规范要点</text>
  <text x="80" y="676" font-size="13" fill="#64748B">· 标题栏固定 48px：左侧 H2 16/600 标题，右侧操作区（维度切换胶囊、时间范围、全屏图标），图标按钮 24×24，圆角 6px。</text>
  <text x="80" y="702" font-size="13" fill="#64748B">· 图表区内边距 24px，坐标轴/网格线使用 #E2E8F0 / #F1F5F9，主色系列遵循配色 token。</text>
  <text x="80" y="728" font-size="13" fill="#64748B">· 卡片圆角 12px，描边 #E2E8F0，Surface #FFFFFF。</text>
</svg>

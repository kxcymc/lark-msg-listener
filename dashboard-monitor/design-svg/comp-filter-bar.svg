<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',-apple-system,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1920" height="1080" fill="#F8FAFC"/>

  <!-- header -->
  <text x="80" y="72" font-size="20" font-weight="600" fill="#0F172A">FilterBar 筛选区</text>
  <text x="80" y="100" font-size="14" fill="#64748B">多筛选控件横排（下拉 / 输入 / 日期）+ 重置 / 查询按钮 + 已选条件 tag，支持展开态与可折叠态。</text>
  <line x1="80" y1="120" x2="1840" y2="120" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 展开态 ===== -->
  <text x="80" y="172" font-size="16" font-weight="600" fill="#0F172A">展开态</text>
  <rect x="80" y="192" width="1760" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- row1 controls -->
  <!-- 消息类型 dropdown -->
  <text x="112" y="240" font-size="13" fill="#64748B">消息类型</text>
  <rect x="112" y="250" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="128" y="273" font-size="13" fill="#0F172A">全部类型</text>
  <path d="M288 266 l5 5 l5 -5" fill="none" stroke="#64748B" stroke-width="1.4"/>

  <!-- 处理状态 dropdown -->
  <text x="344" y="240" font-size="13" fill="#64748B">处理状态</text>
  <rect x="344" y="250" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="360" y="273" font-size="13" fill="#0F172A">成功</text>
  <path d="M520 266 l5 5 l5 -5" fill="none" stroke="#64748B" stroke-width="1.4"/>

  <!-- 关键词 input -->
  <text x="576" y="240" font-size="13" fill="#64748B">关键词</text>
  <rect x="576" y="250" width="280" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="600" cy="268" r="6" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="604" y1="272" x2="608" y2="276" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="618" y="273" font-size="13" fill="#94A3B8">搜索 msg_id / 内容</text>

  <!-- 日期范围 -->
  <text x="888" y="240" font-size="13" fill="#64748B">日期范围</text>
  <rect x="888" y="250" width="280" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="904" y="260" width="14" height="14" rx="3" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <text x="928" y="273" font-size="13" fill="#0F172A">06-05 ～ 06-12</text>

  <!-- 发送者 dropdown -->
  <text x="1200" y="240" font-size="13" fill="#64748B">发送者</text>
  <rect x="1200" y="250" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1216" y="273" font-size="13" fill="#94A3B8">请选择</text>
  <path d="M1376 266 l5 5 l5 -5" fill="none" stroke="#64748B" stroke-width="1.4"/>

  <!-- buttons right -->
  <rect x="1620" y="250" width="92" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1648" y="273" font-size="14" fill="#475569">重置</text>
  <rect x="1724" y="250" width="92" height="36" rx="6" fill="#2563EB"/>
  <text x="1752" y="273" font-size="14" fill="#FFFFFF">查询</text>

  <!-- selected tags row -->
  <line x1="112" y1="320" x2="1808" y2="320" stroke="#F1F5F9" stroke-width="1"/>
  <text x="112" y="362" font-size="13" fill="#64748B">已选条件</text>
  <!-- tag1 -->
  <rect x="184" y="346" width="160" height="28" rx="6" fill="#EFF4FF"/>
  <text x="198" y="365" font-size="12" fill="#2563EB">处理状态：成功</text>
  <line x1="324" y1="356" x2="332" y2="364" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="332" y1="356" x2="324" y2="364" stroke="#2563EB" stroke-width="1.2"/>
  <!-- tag2 -->
  <rect x="356" y="346" width="220" height="28" rx="6" fill="#EFF4FF"/>
  <text x="370" y="365" font-size="12" fill="#2563EB">日期：06-05 ～ 06-12</text>
  <line x1="556" y1="356" x2="564" y2="364" stroke="#2563EB" stroke-width="1.2"/>
  <line x1="564" y1="356" x2="556" y2="364" stroke="#2563EB" stroke-width="1.2"/>
  <!-- clear all -->
  <text x="600" y="365" font-size="12" fill="#94A3B8">清空全部</text>

  <!-- height annotation -->
  <line x1="80" y1="250" x2="100" y2="250" stroke="#DC2626" stroke-width="1"/>
  <line x1="80" y1="286" x2="100" y2="286" stroke="#DC2626" stroke-width="1"/>
  <text x="40" y="272" font-size="11" fill="#DC2626">控件 36px</text>

  <!-- ===== 折叠态 ===== -->
  <text x="80" y="476" font-size="16" font-weight="600" fill="#0F172A">可折叠态（收起，仅显示常用 + 更多筛选入口）</text>
  <rect x="80" y="496" width="1760" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>

  <rect x="112" y="526" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="128" y="549" font-size="13" fill="#0F172A">全部类型</text>
  <path d="M288 542 l5 5 l5 -5" fill="none" stroke="#64748B" stroke-width="1.4"/>

  <rect x="328" y="526" width="280" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="352" cy="544" r="6" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
  <line x1="356" y1="548" x2="360" y2="552" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="370" y="549" font-size="13" fill="#94A3B8">搜索 msg_id / 内容</text>

  <!-- 更多筛选 toggle -->
  <rect x="624" y="526" width="120" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="640" y="549" font-size="13" fill="#2563EB">更多筛选</text>
  <path d="M722 544 l5 5 l5 -5" fill="none" stroke="#2563EB" stroke-width="1.4"/>
  <!-- count badge -->
  <circle cx="744" cy="522" r="9" fill="#DC2626"/>
  <text x="744" y="526" font-size="11" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="1620" y="526" width="92" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1648" y="549" font-size="14" fill="#475569">重置</text>
  <rect x="1724" y="526" width="92" height="36" rx="6" fill="#2563EB"/>
  <text x="1752" y="549" font-size="14" fill="#FFFFFF">查询</text>

  <!-- spec footer -->
  <text x="80" y="664" font-size="16" font-weight="600" fill="#0F172A">规范要点</text>
  <text x="80" y="700" font-size="13" fill="#64748B">· 所有筛选控件高度统一 36px，圆角 6px，控件间距 32px，控件上方带 caption 标签（展开态）。</text>
  <text x="80" y="726" font-size="13" fill="#64748B">· 查询主按钮 Primary #2563EB，重置为次按钮（白底描边）；右对齐固定。</text>
  <text x="80" y="752" font-size="13" fill="#64748B">· 已选条件以可关闭 tag 呈现（浅底 #EFF4FF / Primary 文字 / 关闭叉），并提供「清空全部」。</text>
  <text x="80" y="778" font-size="13" fill="#64748B">· 折叠态仅保留高频控件，「更多筛选」带数字角标提示已激活的隐藏条件数量。</text>
</svg>
